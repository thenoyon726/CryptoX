<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transactions | CryptoX</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{background-color:#000;color:#e5e2e1;overflow-x:hidden;}
  .glass-panel{background:rgba(26,26,26,0.4);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(255,92,0,0.3);border-radius:10px;}
  .filter-btn{background:rgba(26,26,26,0.4);border:1px solid rgba(255,255,255,0.08);color:rgba(228,190,177,0.6);padding:6px 14px;border-radius:999px;font-size:12px;cursor:pointer;transition:all 0.2s;font-family:'Geist',monospace;}
  .filter-btn.active,.filter-btn:hover{background:rgba(255,92,0,0.15);border-color:rgba(255,92,0,0.4);color:#ffb59a;}

    /* Fix white input background */
    input, select, textarea {
      background-color: #0e0e0e !important;
      color: #e5e2e1 !important;
      -webkit-text-fill-color: #e5e2e1 !important;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0px 1000px #0e0e0e inset !important;
      -webkit-text-fill-color: #e5e2e1 !important;
      caret-color: #e5e2e1 !important;
    }
    input::placeholder, textarea::placeholder { 
      color: rgba(228,190,177,0.35) !important; 
    }
    select option {
      background: #0e0e0e;
      color: #e5e2e1;
    }

    </style>
<script id="tailwind-config">
  tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#ffb59a","primary-container":"#ff5c00","on-primary-container":"#521800","background":"#131313","surface-container":"#201f1f","surface-container-low":"#1c1b1b","surface-container-lowest":"#0e0e0e","surface-container-high":"#2a2a2a","on-surface":"#e5e2e1","on-surface-variant":"#e4beb1","outline-variant":"#5b4137","secondary":"#ffdb9d","error":"#ffb4ab","error-container":"#93000a","on-primary":"#5a1b00"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"12px",full:"9999px"},spacing:{"margin-mobile":"20px","stack-md":"16px","gutter":"24px","margin-desktop":"80px","stack-sm":"8px","stack-lg":"32px"},fontFamily:{"label-mono":["Geist"],"headline-lg":["Hanken Grotesk"],"title-md":["Hanken Grotesk"],"body-md":["Inter"],"data-display":["Geist"]},fontSize:{"label-mono":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"500"}],"title-md":["24px",{lineHeight:"32px",fontWeight:"500"}],"data-display":["20px",{lineHeight:"24px",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}]}}}}
</script>
</head>
<body class="dark bg-background text-on-background">
<div id="sidebar-placeholder"></div>

<main class="md:ml-64 p-margin-mobile md:p-stack-lg min-h-screen relative pb-20 md:pb-0">
  <div class="fixed top-0 right-0 w-[500px] h-[500px] pointer-events-none z-0" style="background:radial-gradient(circle,rgba(255,92,0,0.06) 0%,transparent 70%);"></div>

  <header class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center mb-stack-lg gap-4">
    <div>
      <h2 class="font-title-md text-title-md text-on-surface">Transaction History</h2>
      <p class="font-body-md text-body-md text-on-surface-variant/70">All your deposits, withdrawals and swaps.</p>
    </div>
    <button class="flex items-center gap-2 glass-panel px-4 py-2 rounded-lg text-sm font-label-mono text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-sm">download</span> Export CSV
    </button>
  </header>

  <!-- Stats row -->
  <div class="relative z-10 grid grid-cols-2 md:grid-cols-4 gap-gutter mb-gutter">
    <div class="glass-panel p-stack-md rounded-xl">
      <p class="font-label-mono text-[10px] text-on-surface-variant/60 uppercase tracking-widest mb-1">Total In</p>
      <p class="font-data-display text-lg text-primary-container">$0.00</p>
    </div>
    <div class="glass-panel p-stack-md rounded-xl">
      <p class="font-label-mono text-[10px] text-on-surface-variant/60 uppercase tracking-widest mb-1">Total Out</p>
      <p class="font-data-display text-lg text-error">$0.00</p>
    </div>
    <div class="glass-panel p-stack-md rounded-xl">
      <p class="font-label-mono text-[10px] text-on-surface-variant/60 uppercase tracking-widest mb-1">Swaps</p>
      <p class="font-data-display text-lg text-on-surface">24</p>
    </div>
    <div class="glass-panel p-stack-md rounded-xl">
      <p class="font-label-mono text-[10px] text-on-surface-variant/60 uppercase tracking-widest mb-1">This Month</p>
      <p class="font-data-display text-lg text-secondary">$0.00</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="relative z-10 flex flex-wrap gap-2 mb-gutter">
    <button class="filter-btn active" onclick="filterTx('all',this)">All</button>
    <button class="filter-btn" onclick="filterTx('deposit',this)">Deposits</button>
    <button class="filter-btn" onclick="filterTx('withdrawal',this)">Withdrawals</button>
    <button class="filter-btn" onclick="filterTx('swap',this)">Swaps</button>
    <button class="filter-btn" onclick="filterTx('transfer',this)">Transfers</button>
    <div class="ml-auto">
      <input type="text" placeholder="Search transactions..." class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg px-3 py-1.5 text-sm focus:border-primary-container focus:outline-none text-on-surface" style="width:200px;"/>
    </div>
  </div>

  <!-- Table -->
  <div class="relative z-10 glass-panel rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" id="tx-table">
        <thead style="background:rgba(32,31,31,0.6);">
          <tr class="border-b border-outline-variant/10">
            <th class="px-6 py-4 font-label-mono text-[11px] text-on-surface-variant uppercase tracking-wider">Type</th>
            <th class="px-6 py-4 font-label-mono text-[11px] text-on-surface-variant uppercase tracking-wider">Asset</th>
            <th class="px-6 py-4 font-label-mono text-[11px] text-on-surface-variant uppercase tracking-wider">Amount</th>
            <th class="px-6 py-4 font-label-mono text-[11px] text-on-surface-variant uppercase tracking-wider">Value (USD)</th>
            <th class="px-6 py-4 font-label-mono text-[11px] text-on-surface-variant uppercase tracking-wider">Status</th>
            <th class="px-6 py-4 font-label-mono text-[11px] text-on-surface-variant uppercase tracking-wider">Date</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/5" id="tx-body">
        </tbody>
      </table>
    </div>
  </div>

<footer class="relative z-10 mt-8 mb-20 md:mb-0" style="border-top:1px solid rgba(255,255,255,0.05);padding:20px 24px 0;margin:32px 0 0;">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:16px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg width="22" height="22" viewBox="0 0 90 90" style="flex-shrink:0;display:inline-block;"><polygon points="45,4 86,45 45,86 4,45" fill="#ff5c00"/><polygon points="45,14 76,45 45,76 14,45" fill="#c44a00"/><polygon points="45,26 64,45 45,64 26,45" fill="#000"/><line x1="33" y1="33" x2="57" y2="57" stroke="#ff5c00" stroke-width="5.5" stroke-linecap="round"/><line x1="57" y1="33" x2="33" y2="57" stroke="#ff5c00" stroke-width="5.5" stroke-linecap="round"/></svg>
      <span style="font-family:'Hanken Grotesk',sans-serif;font-size:15px;font-weight:800;color:#ffb59a;letter-spacing:-0.03em;">CryptoX</span>
      <span style="font-size:11px;color:rgba(228,190,177,0.3);font-family:'Geist',monospace;">© 2025 All Rights Reserved.</span>
    </div>
    <div style="display:flex;gap:16px;">
      <a href="#" style="font-size:11px;color:rgba(228,190,177,0.4);text-decoration:none;font-family:'Geist',monospace;">Privacy</a>
      <a href="#" style="font-size:11px;color:rgba(228,190,177,0.4);text-decoration:none;font-family:'Geist',monospace;">Terms</a>
      <a href="#" style="font-size:11px;color:rgba(228,190,177,0.4);text-decoration:none;font-family:'Geist',monospace;">Security</a>
    </div>
  </div>
</footer>
</main>

<script src="_sidebar.js"></script>
<script>
document.getElementById('sidebar-placeholder').innerHTML=SIDEBAR('transactions');

const txData=[
  {type:'deposit',icon:'⬇',color:'rgba(255,92,0,0.15)',textColor:'#ff5c00',asset:'BTC',amount:'+0.4500',usd:'+$29,130',status:'Completed',date:'Oct 24, 14:22'},
  {type:'withdrawal',icon:'⬆',color:'rgba(147,0,10,0.15)',textColor:'#ffb4ab',asset:'BTC',amount:'-0.1200',usd:'-$7,714',status:'Completed',date:'Oct 22, 09:10'},
  {type:'swap',icon:'⇄',color:'rgba(255,255,255,0.05)',textColor:'#ffdb9d',asset:'ETH→USDT',amount:'-1.5 ETH',usd:'$5,131',status:'Completed',date:'Oct 23, 11:05'},
  {type:'transfer',icon:'→',color:'rgba(255,92,0,0.1)',textColor:'#ffb59a',asset:'ETH',amount:'+1.4000',usd:'+$4,789',status:'Completed',date:'Oct 23, 09:15'},
  {type:'deposit',icon:'⬇',color:'rgba(255,92,0,0.15)',textColor:'#ff5c00',asset:'USDT',amount:'+5,000',usd:'+$5,000',status:'Completed',date:'Oct 21, 18:44'},
  {type:'withdrawal',icon:'⬆',color:'rgba(147,0,10,0.15)',textColor:'#ffb4ab',asset:'USD',amount:'-$2,000',usd:'-$2,000',status:'Completed',date:'Aug 22, 9:20'},
  {type:'deposit',icon:'⬇',color:'rgba(255,92,0,0.15)',textColor:'#ff5c00',asset:'BTC',amount:'+0.0042',usd:'+$270',status:'Pending',date:'Aug 24, 2:14'},
  {type:'swap',icon:'⇄',color:'rgba(255,255,255,0.05)',textColor:'#ffdb9d',asset:'SOL→ETH',amount:'+2.5 ETH',usd:'$8,552',status:'Completed',date:'Aug 20, 14:00'},
];

function renderTx(data){
  const tbody=document.getElementById('tx-body');
  tbody.innerHTML=data.map(tx=>`
    <tr class="hover:bg-white/3 transition-colors" style="border-bottom:1px solid rgba(91,65,55,0.08);">
      <td class="px-6 py-4">
        <div class="flex items-center gap-3">
          <div style="width:32px;height:32px;border-radius:8px;background:${tx.color};display:flex;align-items:center;justify-content:center;font-size:14px;color:${tx.textColor};">${tx.icon}</div>
          <span class="font-label-mono text-sm capitalize">${tx.type}</span>
        </div>
      </td>
      <td class="px-6 py-4 font-label-mono text-sm text-on-surface-variant">${tx.asset}</td>
      <td class="px-6 py-4 font-data-display text-sm" style="color:${tx.textColor};">${tx.amount}</td>
      <td class="px-6 py-4 font-label-mono text-sm text-on-surface">${tx.usd}</td>
      <td class="px-6 py-4">
        <span style="background:${tx.status==='Completed'?'rgba(255,92,0,0.1)':'rgba(255,186,32,0.1)'};color:${tx.status==='Completed'?'#ff5c00':'#ffba20'};border:1px solid ${tx.status==='Completed'?'rgba(255,92,0,0.3)':'rgba(255,186,32,0.3)'};font-size:10px;padding:2px 8px;border-radius:4px;font-family:'Geist',monospace;font-weight:700;">${tx.status}</span>
      </td>
      <td class="px-6 py-4 font-label-mono text-sm text-on-surface-variant">${tx.date}</td>
    </tr>
  `).join('');
}

function filterTx(type,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTx(type==='all'?txData:txData.filter(t=>t.type===type));
}

renderTx(txData);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CryptoX</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;}

  .splash{
    width:100%;height:100vh;
    background:#000;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }

  /* Ambient glow */
  .glow-center{
    position:absolute;
    width:400px;height:400px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,92,0,0.14) 0%,transparent 70%);
    top:50%;left:50%;transform:translate(-50%,-55%);
    pointer-events:none;
  }
  .glow-bottom{
    position:absolute;bottom:-80px;left:50%;transform:translateX(-50%);
    width:600px;height:200px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,92,0,0.07) 0%,transparent 70%);
    pointer-events:none;
  }

  /* Logo wrapper */
  .logo-wrap{
    display:flex;flex-direction:column;align-items:center;gap:0;
    opacity:0;
    animation:splashIn 0.9s cubic-bezier(0.34,1.4,0.64,1) 0.2s forwards;
    position:relative;z-index:10;
  }
  @keyframes splashIn{
    0%{opacity:0;transform:scale(0.5);}
    100%{opacity:1;transform:scale(1);}
  }

  /* Diamond X icon */
  .diamond-icon{
    width:100px;height:100px;margin-bottom:22px;
    animation:iconGlow 2s ease-in-out 1.2s infinite alternate;
    filter:drop-shadow(0 0 0px rgba(255,92,0,0));
  }
  @keyframes iconGlow{
    0%{filter:drop-shadow(0 0 6px rgba(255,92,0,0.4));}
    100%{filter:drop-shadow(0 0 22px rgba(255,92,0,0.7));}
  }

  /* Brand name */
  .brand{
    font-family:'Hanken Grotesk','Arial Black',Arial,sans-serif;
    font-size:38px;font-weight:900;
    color:#fff;letter-spacing:-0.04em;
    display:flex;align-items:center;gap:2px;
  }
  .brand-x{color:#ff5c00;}
  .brand-tag{
    font-family:'Inter',Arial,sans-serif;
    font-size:11px;font-weight:500;
    color:rgba(255,181,154,0.4);
    letter-spacing:0.18em;text-transform:uppercase;
    margin-top:8px;
  }

  /* Loading bar */
  .loader-wrap{
    margin-top:56px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    opacity:0;
    animation:fadeUp 0.5s ease 0.9s forwards;
    position:relative;z-index:10;
  }
  @keyframes fadeUp{
    0%{opacity:0;transform:translateY(8px);}
    100%{opacity:1;transform:translateY(0);}
  }

  .bar-track{
    width:140px;height:2px;
    background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#ff5c00,#ffb59a);
    border-radius:2px;
    animation:barFill 1.6s cubic-bezier(0.4,0,0.2,1) 1s forwards;
  }
  @keyframes barFill{
    0%{width:0%;}
    50%{width:70%;}
    85%{width:90%;}
    100%{width:100%;}
  }

  /* Dots */
  .dots{display:flex;gap:7px;margin-top:2px;}
  .dot{
    width:5px;height:5px;border-radius:50%;
    background:rgba(255,92,0,0.35);
  }
  .dot:nth-child(1){animation:dotBeat 1.1s 1.0s ease-in-out infinite;}
  .dot:nth-child(2){animation:dotBeat 1.1s 1.2s ease-in-out infinite;}
  .dot:nth-child(3){animation:dotBeat 1.1s 1.4s ease-in-out infinite;}
  @keyframes dotBeat{
    0%,100%{background:rgba(255,92,0,0.3);transform:scale(1);}
    50%{background:#ff5c00;transform:scale(1.5);}
  }

  /* Version */
  .version{
    position:absolute;bottom:24px;
    font-family:'Geist',monospace,Arial;
    font-size:11px;color:rgba(255,255,255,0.12);
    letter-spacing:0.1em;z-index:10;
  }

  /* Fade out animation when redirecting */
  .splash.fade-out{
    animation:fadeOut 0.5s ease forwards;
  }
  @keyframes fadeOut{
    0%{opacity:1;}
    100%{opacity:0;}
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@900&family=Inter:wght@400;500&family=Geist:wght@400&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="splash" id="splash">

  <div class="glow-center"></div>
  <div class="glow-bottom"></div>

  <!-- Logo -->
  <div class="logo-wrap">

    <!-- Diamond X Icon -->
    <svg class="diamond-icon" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
      <polygon points="45,4 86,45 45,86 4,45" fill="#ff5c00"/>
      <polygon points="45,14 76,45 45,76 14,45" fill="#c44a00"/>
      <polygon points="45,26 64,45 45,64 26,45" fill="#000"/>
      <line x1="33" y1="33" x2="57" y2="57" stroke="#ff5c00" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="57" y1="33" x2="33" y2="57" stroke="#ff5c00" stroke-width="5.5" stroke-linecap="round"/>
    </svg>

    <!-- Brand name -->
    <div class="brand">Crypto<span class="brand-x">X</span></div>
    <div class="brand-tag">Pro Crypto Trading</div>
  </div>

  <!-- Loader -->
  <div class="loader-wrap">
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="version">v1.0.0</div>
</div>

<script>
  // After 2.5s redirect to dashboard
  setTimeout(function(){
    document.getElementById('splash').classList.add('fade-out');
    setTimeout(function(){
      window.location.href = 'home.html';
    }, 500);
  }, 2500);
</script>
</body>
</html>
